<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>zCoin</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#31d53d" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(
          45deg,
          #115dd8 0%,
          #20aaea 33%,
          #f1f7da 100%
        );
      }

      #coin {
        width: 100vw;
        aspect-ratio: 1/1;
        position: relative;
        margin: 10%;
        max-width: 512px;
        pointer-events: none;
      }

      #coin > img {
        display: none;
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        transition: transform 0.5s ease-in-out;
        backface-visibility: hidden;
      }

      #coin[data-state="flip"] > #flip {
        display: block;
      }
      #coin[data-state="head"] > #head {
        display: block;
      }
      #coin[data-state="tail"] > #tail {
        display: block;
      }

      #flip {
        animation: spin 1s cubic-bezier(0.4, 2.5, 0.6, 0.5);
      }

      @keyframes spin {
        0% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="coin" data-state="head">
      <img id="flip" src="images/coin-flip.png" alt="" />
      <img id="head" src="images/coin-head.png" alt="" />
      <img id="tail" src="images/coin-tail.png" alt="" />
    </div>

    <script type="module">
      import { SplashScreen } from "@capacitor/splash-screen"
      import Hammer from "hammerjs"

      function toss(val) {
        const coin = document.querySelector("#coin")
        const face = val < 0.5 ? "head" : "tail"

        if (coin.dataset.state === "flip") {
          return
        }

        coin.dataset.state = "flip"
        setTimeout(() => (coin.dataset.state = face), 1000)
      }

      const mc = new Hammer(document.body)
      mc.get("swipe").set({ direction: Hammer.DIRECTION_ALL })
      mc.on("swipe tap", function (event) {
        toss(event.type === "swipe" ? 1 : 0)
      })

      setTimeout(() => {
        SplashScreen.hide()
      }, 1000)
    </script>
  </body>
</html>
